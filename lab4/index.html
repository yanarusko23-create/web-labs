<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Лабораторна 4 — RC5-32/12/16</title>
<style>
 body{font-family:system-ui,sans-serif;max-width:720px;margin:2rem auto;padding:0 1rem}
 label{display:block;margin-top:1rem;font-weight:600}
 input,textarea{width:100%;box-sizing:border-box;font-family:monospace;padding:.5rem}
 button{margin:1rem .5rem 0 0;padding:.6rem 1.2rem}
 pre{background:#f2f2f2;padding:1rem;min-height:2rem;white-space:pre-wrap}
</style>
</head>
<body>
<h1>RC5-32/12/16</h1>
<label for="src">Дані (hex-байти через пробіл)</label>
<textarea id="src" rows="3">21 A5 DB EE 15 4B 8F 6D</textarea>
<label for="key">Ключ (16 байт, hex через пробіл)</label>
<input id="key" value="91 5F 46 19 BE 41 B2 51 63 55 A5 01 10 A9 CE 91">
<button id="enc">Шифрувати</button><button id="dec">Дешифрувати</button>
<h2>Результат</h2>
<pre id="out"></pre>
<script src="rc5.js"></script>
<script>
const parse = s => s.trim().split(/\s+/).filter(Boolean).map(h => parseInt(h, 16));
function run(mode){
  const src = parse(document.getElementById("src").value);
  const key = parse(document.getElementById("key").value);
  const out = document.getElementById("out");
  if (key.length !== 16 || key.some(isNaN) || src.some(isNaN)) { out.textContent = "Помилка: ключ має містити рівно 16 hex-байтів, дані — коректні hex-значення."; return; }
  out.textContent = Task1(src, src.length, key, mode);
}
document.getElementById("enc").onclick = () => run(true);
document.getElementById("dec").onclick = () => run(false);
</script>
</body>
</html>
